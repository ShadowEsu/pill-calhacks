<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}svg{display:block}</style>
<script src="../anim/lib.js"></script>
<svg id="s" width="500" height="500" viewBox="0 0 500 500"></svg>
<script>
window.ANIM = { w: 500, h: 500, dur: 1.2 };
// "Magical water": three wavy blue ripple rings expand from the centre, six blue sparkles burst outward
// and fade. Dark outlines throughout (cartoon style).
const BLUE = '#2f8cff', LIGHT = SKY;
const STAR = 'M0 -20 Q4 -4 20 0 Q4 4 0 20 Q-4 4 -20 0 Q-4 -4 0 -20 Z';
const wavy = (r, ph) => {           // closed wavy ring of radius r, 10 lobes
  let d = '';
  for (let i = 0; i <= 120; i++) {
    const a = (i / 120) * Math.PI * 2, rr = r * (1 + 0.06 * Math.sin(10 * a + ph));
    d += `${i ? 'L' : 'M'}${(250 + rr * Math.cos(a)).toFixed(1)} ${(250 + rr * Math.sin(a)).toFixed(1)}`;
  }
  return d + 'Z';
};
let html = '';
for (let k = 0; k < 3; k++) html += `<g id="r${k}"><path id="ro${k}" fill="none" stroke="${INK}" stroke-width="16"/><path id="ri${k}" fill="none" stroke="${k % 2 ? LIGHT : BLUE}" stroke-width="8"/></g>`;
for (let k = 0; k < 6; k++) html += `<g id="s${k}"><path d="${STAR}" fill="${k % 2 ? LIGHT : BLUE}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></g>`;
html += `<g id="drop"><circle cx="250" cy="250" r="26" fill="${LIGHT}" stroke="${INK}" stroke-width="8"/><circle cx="241" cy="240" r="7" fill="#fff"/></g>`;
$('s').innerHTML = html;
window.render = (t) => {
  for (let k = 0; k < 3; k++) {
    const u = local(t, k * 0.18, 0.85), r = 30 + 190 * easeOutCubic(u);
    const d = wavy(r, t * 9 + k * 2);
    $(`ro${k}`).setAttribute('d', d); $(`ri${k}`).setAttribute('d', d);
    $(`r${k}`).style.opacity = u <= 0 ? 0 : (1 - u) ** 1.2;
  }
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2 - Math.PI / 2 + 0.3, u = local(t, 0.08 + k * 0.03, 0.9);
    const r = 40 + 170 * easeOutCubic(u), sc = u <= 0 ? 0 : Math.sin(Math.PI * Math.min(1, u * 1.15)) * 1.1;
    $(`s${k}`).setAttribute('transform', `translate(${250 + r * Math.cos(a)} ${250 + r * Math.sin(a)}) rotate(${t * 220}) scale(${Math.max(0, sc)})`);
  }
  const dp = springPop(t) * (1 - local(t, 0.35, 0.3));
  $('drop').setAttribute('transform', `translate(250 250) scale(${Math.max(0, dp)}) translate(-250 -250)`);
};
window.render(0);
</script>
